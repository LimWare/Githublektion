<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git & Flowchart Pro Challenge - Programmering 1</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --correct: #22c55e;
            --wrong: #ef4444;
            --border: #334155;
            --code-bg: #090d16;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { max-width: 820px; width: 100%; margin: auto; }
        header { text-align: center; margin-bottom: 24px; padding: 22px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); }
        h1 { font-size: 1.8rem; color: var(--accent); margin-bottom: 6px; }
        .subtitle { color: var(--text-muted); font-size: 0.95rem; }
        .filter-bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
        .filter-btn { background: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: 0.2s; }
        .filter-btn.active, .filter-btn:hover { background: var(--accent); color: #000; font-weight: 700; border-color: var(--accent); }
        .card { background: var(--card-bg); padding: 28px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
        .progress-bar { height: 8px; background: var(--bg-dark); border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }
        .meta-info { display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 14px; font-weight: 600; }
        .category-badge { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 3px 10px; border-radius: 99px; font-size: 0.8rem; border: 1px solid rgba(56, 189, 248, 0.3); }
        .question-text { font-size: 1.25rem; font-weight: 600; margin-bottom: 18px; }
        
        /* Symbol Container */
        .symbol-display { background: #0b1120; border: 1px solid var(--border); border-radius: 10px; padding: 24px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; min-height: 140px; }
        .symbol-display svg { max-width: 240px; height: 90px; }

        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border); padding: 14px 18px; border-radius: 8px; text-align: left; font-size: 0.98rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between; }
        .option-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(56, 189, 248, 0.05); }
        .option-btn.correct { background: rgba(34, 197, 94, 0.2) !important; border-color: var(--correct) !important; color: #fff !important; font-weight: 600; }
        .option-btn.wrong { background: rgba(239, 68, 68, 0.2) !important; border-color: var(--wrong) !important; color: #fff !important; }
        .option-btn:disabled { cursor: default; }

        /* Skriv själv formulär */
        .typein-box { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .cmd-input { width: 100%; background: var(--code-bg); border: 1px solid var(--border); color: #38bdf8; font-family: monospace; font-size: 1.1rem; padding: 14px; border-radius: 8px; outline: none; }
        .cmd-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        .submit-cmd-btn { background: var(--accent); color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem; align-self: flex-start; }
        .submit-cmd-btn:hover { background: var(--accent-hover); color: #fff; }

        .feedback-box { margin-top: 22px; padding: 16px; border-radius: 8px; background: rgba(15, 23, 42, 0.85); border-left: 4px solid var(--accent); display: none; }
        .feedback-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 6px; }
        .feedback-text { font-size: 0.95rem; color: #cbd5e1; }
        .controls { margin-top: 24px; display: flex; justify-content: flex-end; }
        .next-btn { background: var(--accent); color: #000; border: none; padding: 12px 26px; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; display: none; }
        .next-btn:hover { background: var(--accent-hover); color: #fff; }

        .result-screen { text-align: center; display: none; }
        .score-circle { font-size: 3.2rem; font-weight: 800; color: var(--accent); margin: 20px 0; }
        code { background: #000; padding: 2px 6px; border-radius: 4px; color: #38bdf8; font-family: monospace; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Git & Flowchart Pro Challenge</h1>
        <p class="subtitle">Skriv kommandona själv, tolka flödesschemasymboler och undvik kuggfrågorna!</p>
        <div class="filter-bar">
            <button class="filter-btn active" onclick="startQuiz('Alla')">Alla Utmaningar (30)</button>
            <button class="filter-btn" onclick="startQuiz('Skriv Själv')">Skriv Kommandot Själv</button>
            <button class="filter-btn" onclick="startQuiz('Symboler')">Symbol-Identifiering</button>
            <button class="filter-btn" onclick="startQuiz('Git & Push/Pull')">Git Koncept & Push/Pull</button>
        </div>
    </header>

    <div class="card" id="quiz-card">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="meta-info">
            <span id="question-counter">Fråga 1 av 30</span>
            <span class="category-badge" id="category-badge">Kategori</span>
        </div>
        
        <div class="question-text" id="question-text">Laddar fråga...</div>
        
        <!-- Visuell symbol visas om frågan har en SVG -->
        <div class="symbol-display" id="symbol-display" style="display: none;"></div>

        <!-- Flervalslista -->
        <div class="options-list" id="options-list"></div>

        <!-- Skriv själv fält -->
        <div class="typein-box" id="typein-box" style="display: none;">
            <input type="text" class="cmd-input" id="cmd-input" placeholder="Skriv kommandot här..." autocomplete="off" spellcheck="false">
            <button class="submit-cmd-btn" id="submit-cmd-btn" onclick="checkTypedAnswer()">Bekräfta svar</button>
        </div>

        <div class="feedback-box" id="feedback-box">
            <div class="feedback-title" id="feedback-title"></div>
            <div class="feedback-text" id="feedback-text"></div>
        </div>

        <div class="controls">
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Nästa utmaning →</button>
        </div>
    </div>

    <div class="card result-screen" id="result-screen">
        <h2>Resultat slutfört!</h2>
        <div class="score-circle" id="final-score">0 / 0</div>
        <p id="result-message" style="margin-bottom: 24px; color: var(--text-muted);"></p>
        <button class="next-btn" style="display:inline-block;" onclick="startQuiz(currentFilter)">Försök igen</button>
    </div>
</div>

<script>
// SVG Symboler
const svgSymbols = {
    terminator: `<svg viewBox="0 0 200 80"><rect x="10" y="15" width="180" height="50" rx="25" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="4"/><text x="100" y="47" fill="#f8fafc" font-size="16" text-anchor="middle" font-weight="bold">START / STOP</text></svg>`,
    process: `<svg viewBox="0 0 200 80"><rect x="15" y="15" width="170" height="50" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="4"/><text x="100" y="47" fill="#f8fafc" font-size="15" text-anchor="middle" font-weight="bold">SUM = A + B</text></svg>`,

    preparation: `<svg viewBox="0 0 200 80"><polygon points="40,15 160,15 185,40 160,65 40,65 15,40" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="4"/><text x="100" y="46" fill="#f8fafc" font-size="14" text-anchor="middle" font-weight="bold">Initiera variabler</text></svg>`,
    alternate: `<svg viewBox="0 0 200 80"><rect x="15" y="15" width="170" height="50" rx="12" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="4"/><text x="100" y="47" fill="#f8fafc" font-size="13" text-anchor="middle" font-weight="bold">Alternativt Flöde</text></svg>`,
    multiDoc: `<svg viewBox="0 0 200 90"><path d="M 30 10 L 190 10 L 190 55 Q 150 42 110 55 T 30 55 Z" fill="none" stroke="#64748b" stroke-width="2"/><path d="M 25 15 L 185 15 L 185 60 Q 145 47 105 60 T 25 60 Z" fill="none" stroke="#94a3b8" stroke-width="3"/><path d="M 20 20 L 180 20 L 180 65 Q 140 52 100 65 T 20 65 Z" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="4"/></svg>`
};

const allQuestions = [
    // ==========================================
    // DEL 1: SKRIV SJÄLV (Git Kommandon)
    // ==========================================
    {
        type: "typein",
        category: "Skriv Själv",
        question: "Vad skriver du i terminalen för att initiera ett nytt, tomt Git-repositorium i din arbetskatalog?",
        validAnswers: ["git init"],
        explanation: "'git init' skapar den dolda underkatalogen .git och initierar projektet som ett lokalt repo."
    },
    {
        type: "typein",
        category: "Skriv Själv",
        question: "Vilket kommando visar aktuell status för ändrade, otrackade eller stageade filer i projektet?",
        validAnswers: ["git status"],
        explanation: "'git status' ger en översikt över arbetskatalogen och vad som lagts till i Staging Area."
    },
    {
        type: "typein",
        category: "Skriv Själv",
        question: "Hur lägger du till ALLA ändrade filer och nytillkomna filer i den aktuella mappen till staging area?",
        validAnswers: ["git add ."],
        explanation: "'git add .' inkluderar alla ändringar i nuvarande katalog och underkataloger i staging."
    },
    {
        type: "typein",
        category: "Skriv Själv",
        question: "Hur stagear du specifikt filen med namnet 'uddaTal.py' inför en commit?",
        validAnswers: ["git add uddaTal.py"],
        explanation: "'git add <filnamn>' stagear en enskild specificerad fil."
    },
    {
        type: "typein",
        category: "Skriv Själv",
        question: "Hur gör du en commit med meddelandet 'Fixat bugg' direkt i ett enda kommando?",
        validAnswers: ['git commit -m "Fixat bugg"', "git commit -m 'Fixat bugg'"],
        explanation: "Flaggan -m låter dig skriva commit-meddelandet direkt: git commit -m \"Fixat bugg\"."
    },
    {
        type: "typein",
        category: "Skriv Själv",
        question: "Vilket kommando listar versionshistoriken och visar varje tidigare commits commit-ID (hash)?",
        validAnswers: ["git log"],
        explanation: "'git log' listar commits i omvänd kronologisk ordning med commit-ID och författare."
    },
    {
        type: "typein",
        category: "Skriv Själv",
        question: "Vilket kommando listar alla dina befintliga LOKALA branches i repot och markerar den aktiva med en asterisk (*)?",
        validAnswers: ["git branch"],
        explanation: "'git branch' utan argument listar lokala grenar."
    },
    {
        type: "typein",
        category: "Skriv Själv",
        question: "Hur skapar du och byter till en ny branch med namnet 'login-feature' i ETT enda klassiskt kommando?",
        validAnswers: ["git checkout -b login-feature"],
        explanation: "'git checkout -b <namn>' kombinerar grenskapande och växling. (Det moderna alternativet är 'git switch -c')."
    },
    {
        type: "typein",
        category: "Skriv Själv",
        question: "Vilket kommando raderar en befintlig lokal gren som heter 'old-feature'?",
        validAnswers: ["git branch -d old-feature"],
        explanation: "'git branch -d <namn>' raderar den angivna grenen."
    },
    {
        type: "typein",
        category: "Skriv Själv",
        question: "Vilket kommando används för att ladda upp dina lokala commits från ditt lokala repo till ett fjärr-repo (remote)?",
        validAnswers: ["git push"],
        explanation: "'git push' skickar dina lokala commits upp till fjärrservern (t.ex. GitHub)."
    },
    {
        type: "typein",
        category: "Skriv Själv",
        question: "Vilket kommando hämtar hem kollegornas ändringar från ett fjärr-repo och slår ihop dem med din lokala gren?",
        validAnswers: ["git pull"],
        explanation: "'git pull' laddar ner och slår ihop (mergar) ändringar från fjärr-repot till ditt lokala repo."
    },
    {
        type: "typein",
        category: "Skriv Själv",
        question: "Vilket kommando skriver du för att kontrollera vilken version av Git som är installerad på datorn?",
        validAnswers: ["git --version"],
        explanation: "'git --version' verifierar installationen och returnerar versionen."
    },

    // ==========================================
    // DEL 2: VISUELLA SYMBOL-UTMANINGAR (Flödesschema)
    // ==========================================
    {
        type: "mcq",
        category: "Symboler",
        symbol: "io",
        question: "Titta på symbolen ovan (Parallellogram). Vad är dess exakta funktion i ett flödesschema?",
        options: [
            "Indata / Utdata (t.ex. att läsa in användarvärden eller skriva ut ett resultat på skärmen)",
            "En process eller beräkning (t.ex. att utföra en matematisk formel)",
            "Ett villkor där koden måste välja mellan två olika vägar (Ja eller Nej)",
            "Att markera start eller stopp på hela programkörningen"
        ],
        correct: 0,
        explanation: "Kugga dig inte på formen: Parallellogrammet används strikt för Input och Output (t.ex. 'Mata in ålder' eller 'Print area'). Beräkningar hör hemma i rektangeln."
    },
    {
        type: "mcq",
        category: "Symboler",
        symbol: "process",
        question: "Titta på symbolen ovan (Rektangel). Vilket påstående beskriver bäst vad som ska placeras här?",
        options: [
            "En handling eller beräkning (t.ex. 'SUM = A + B' eller 'area = bredd * längd')",
            "Inmatning av text eller lösenord från användarens tangentbord",
            "En Ja/Nej-fråga som delar flödet i två förgreningar",
            "En förberedelse där variabler deklareras inför en loop"
        ],
        correct: 0,
        explanation: "Rektangeln är en Process/Action-symbol och representerar utförande av ett steg, tilldelning eller beräkning."
    },
    {
        type: "mcq",
        category: "Symboler",
        symbol: "decision",
        question: "Titta på symbolen ovan (Romb / Diamant). Hur skiljer sig denna från övriga symboler vad gäller utgående pilar?",
        options: [
            "Den utvärderar ett villkor och har alltid minst två utgående vägar (oftast Ja och Nej)",
            "Den har endast en enda utgående pil som leder direkt till programmets slut",
            "Den tar emot data från internet och sparar i ett dokument",
            "Den utför en beräkning och returnerar automatiskt svaret till Start"
        ],
        correct: 0,
        explanation: "Romben (Decision) är den enda grundsymbolen som delar upp processen i olika förgreningar beroende på svaret på frågan."
    },
    {
        type: "mcq",
        category: "Symboler",
        symbol: "terminator",
        question: "Titta på symbolen ovan (Oval / Avrundad rektangel). Vad kallas den och vad gör den?",
        options: [

        ],
        correct: 0,
        explanation: "Ovalen kallas formellt 'Terminator' och markerar startpunkten och slutpunkten för schemat."
    },
    {
        type: "mcq",
        category: "Symboler",
        symbol: "connector",
        question: "Titta på den lilla cirkelformade symbolen ovan. Vad kallas den enligt symboltabellen i Lektion 13?",

        ],
        correct: 0,
        explanation: "I tabellen definieras Connector som: 'Indicates the flow connection to the next symbol'."
    },
    {
        type: "mcq",
        category: "Symboler",
        symbol: "document",
        question: "Titta på symbolen ovan (rektangel med vågig botten). Vad representerar den?",
        options: [
            "Document – Indikerar en rapport, utskrift eller ett genererat dokument",
            "Parallellogram – En förvrängd symbol för tangentbordsinmatning",
            "Felhantering – Indikerar att programmet fångat ett SyntaxError",
            "Commit – En visuell representation av en sparad Git-fil"
        ],
        correct: 0,
        explanation: "I Lektion 13 beskrivs symbolen som: 'Document - Indicates a report or a document'."
    },
    {
        type: "mcq",
        category: "Symboler",
        symbol: "multiDoc",
        question: "Titta på symbolen ovan med flera överlappande vågiga blad. Vad indikerar den?",
        options: [
            "Multiple Document – Indikerar att flera dokument eller rapporter hanteras samtidigt",
            "Version History – Representerar alla tidigare commits i Git",
            "Array / Lista – Indikerar en datastruktur med flera värden",
            "Multi-threading – Visar att två processorer arbetar samtidigt"
        ],
        correct: 0,
        explanation: "I lektionsmaterialet specificeras: 'Multiple document - Indicates multiple documents or reports'."
    },
    {
        type: "mcq",
        category: "Symboler",
        symbol: "preparation",
        question: "Titta på den sexkantiga symbolen (utdragen hexagon). Vad indikerar 'Preparation'?",
        options: [
            "Initiering eller förberedelse inför ett kommande steg (t.ex. nollställa en räknare)",
            "Slutgiltig kompilering av projektets källkod",
            "Att användaren måste bekräfta med lösenord två gånger",
            "Att internetanslutningen kontrolleras"
        ],
        correct: 0,
        explanation: "'Preparation' indikerar: 'preparation taken for the following step', ofta använt för att sätta startvärden på loop-variabler."
    },
    {
        type: "mcq",
        category: "Symboler",
        symbol: "alternate",
        question: "Titta på symbolen ovan (rektangel med mjuka hörn). Vad betyder 'Alternate' i schemat?",

            "Indikerar att källkoden är skriven i ett annat språk"
        ],
        correct: 0,
        explanation: "I symboltabellen anges: 'Alternate - Indicates an alternate process to take place'."

    // ==========================================
    // DEL 3: GIT KONCEPT, LOGIK & PUSH/PULL
    // ==========================================
    {
        type: "mcq",
        category: "Git & Push/Pull",
        question: "Varför kan du arbeta och göra commits i Git även när du sitter på tåget helt utan internet?",

    {

        correct: 0,

    {

let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let currentFilter = 'Alla';

function startQuiz(filter) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(filter) || (filter === 'Alla' && btn.textContent.includes('Alla')));
    });

    if (filter === 'Alla') {
        currentQuestions = [...allQuestions];
    } else {
        currentQuestions = allQuestions.filter(q => q.category === filter);
    }
    
    // Slumpa ordningen på frågorna så det blir en ny utmaning varje gång
    currentQuestions.sort(() => Math.random() - 0.5);

    currentIndex = 0;
    score = 0;
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('quiz-card').style.display = 'block';
    showQuestion();
}

function showQuestion() {
    const q = currentQuestions[currentIndex];
    const total = currentQuestions.length;
    document.getElementById('question-counter').textContent = `Utmaning ${currentIndex + 1} av ${total}`;
    document.getElementById('category-badge').textContent = q.category;
    document.getElementById('progress-fill').style.width = `${((currentIndex) / total) * 100}%`;
    document.getElementById('question-text').textContent = q.question;

    const symbolDisplay = document.getElementById('symbol-display');
    const optionsList = document.getElementById('options-list');
    const typeinBox = document.getElementById('typein-box');
    const cmdInput = document.getElementById('cmd-input');

    // Återställ vyer
    symbolDisplay.style.display = 'none';
    symbolDisplay.innerHTML = '';
    optionsList.style.display = 'none';
    optionsList.innerHTML = '';
    typeinBox.style.display = 'none';
    cmdInput.value = '';
    cmdInput.disabled = false;
    document.getElementById('submit-cmd-btn').disabled = false;
    document.getElementById('feedback-box').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';

    // Om frågan har en SVG-symbol
    if (q.symbol && svgSymbols[q.symbol]) {
        symbolDisplay.innerHTML = svgSymbols[q.symbol];
        symbolDisplay.style.display = 'flex';
    }

    if (q.type === 'typein') {
        typeinBox.style.display = 'flex';
        cmdInput.focus();
    } else {
        optionsList.style.display = 'flex';
        // Slumpa svarsalternativen så rätt svar inte alltid är på samma plats
        let indices = q.options.map((_, i) => i);
        indices.sort(() => Math.random() - 0.5);

        indices.forEach(optIndex => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = q.options[optIndex];
            btn.onclick = () => selectOption(btn, optIndex === q.correct, q.explanation);
            btn.dataset.correct = (optIndex === q.correct);
            optionsList.appendChild(btn);
        });
    }
}

function selectOption(selectedBtn, isCorrect, explanation) {
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.dataset.correct === "true") {
            btn.classList.add('correct');
        }
    });

    const feedbackBox = document.getElementById('feedback-box');
    const feedbackTitle = document.getElementById('feedback-title');
    const feedbackText = document.getElementById('feedback-text');

    if (isCorrect) {
        score++;
        selectedBtn.classList.add('correct');
        feedbackTitle.textContent = "Helt rätt! 🎯";
        feedbackTitle.style.color = "var(--correct)";
    } else {
        selectedBtn.classList.add('wrong');
        feedbackTitle.textContent = "Du gick i fällan! ❌";
        feedbackTitle.style.color = "var(--wrong)";
    }

    feedbackText.textContent = explanation;
    feedbackBox.style.display = 'block';
    document.getElementById('next-btn').style.display = 'inline-block';
}

function checkTypedAnswer() {
    const q = currentQuestions[currentIndex];
    const input = document.getElementById('cmd-input');
    const userVal = input.value.trim();
    
    if (!userVal) return;

    input.disabled = true;
    document.getElementById('submit-cmd-btn').disabled = true;

    // Normalisera citattecken så att både " och ' accepteras
    const normalize = str => str.toLowerCase().replace(/['"]/g, '"').replace(/\s+/g, ' ');
    const isCorrect = q.validAnswers.some(ans => normalize(ans) === normalize(userVal));

    const feedbackBox = document.getElementById('feedback-box');
    const feedbackTitle = document.getElementById('feedback-title');
    const feedbackText = document.getElementById('feedback-text');

    if (isCorrect) {
        score++;
        input.style.borderColor = "var(--correct)";
        feedbackTitle.textContent = "Perfekt syntax! 💻";
        feedbackTitle.style.color = "var(--correct)";
        feedbackText.innerHTML = `<strong>Rätt:</strong> <code>${userVal}</code><br>${q.explanation}`;
    } else {
        input.style.borderColor = "var(--wrong)";
        feedbackTitle.textContent = "Inte riktigt rätt kommando ❌";
        feedbackTitle.style.color = "var(--wrong)";
        feedbackText.innerHTML = `Du skrev: <code>${userVal}</code><br>Rätt syntax är t.ex: <code>${q.validAnswers[0]}</code><br><br>${q.explanation}`;
    }

    feedbackBox.style.display = 'block';
    document.getElementById('next-btn').style.display = 'inline-block';
}

// Tillåt Enter-tangenten i skriv-själv fältet
document.getElementById('cmd-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        checkTypedAnswer();
    }
});

function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
        showQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById('quiz-card').style.display = 'none';
    const resultScreen = document.getElementById('result-screen');
    resultScreen.style.display = 'block';
    const total = currentQuestions.length;
    document.getElementById('final-score').textContent = `${score} / ${total}`;
    const pct = Math.round((score / total) * 100);
    
    let msg = `Du fick ${pct}% rätt! `;
    if (pct === 100) msg += "Otroligt! Du behärskar både kommandosyntax och alla luriga symboler utan problem.";
    else if (pct >= 80) msg += "Riktigt starkt resultat! Du genomskådade de flesta fällor och har bra koll på Git.";
    else if (pct >= 60) msg += "Helt okej! Du har grunderna, men öva gärna en runda till på kommandona du fick skriva själv.";
    else msg += "Bra träning! Kommandona och symbolerna sätter sig om du kör utmaningen en gång till.";
    
    document.getElementById('result-message').textContent = msg;
}

startQuiz('Alla');
</script>
