<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git & Flowchart - Provträning</title>
<style>
:root {
  --bg-dark: #0f172a;
  --card-bg: #1e293b;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --accent: #38bdf8;
  --accent-hover: #0284c7;
  --correct: #22c55e;
  --wrong: #ef4444;
  --border: #334155;
  --code-bg: #090d16;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
.container { max-width: 820px; width: 100%; margin: auto; }
header { text-align: center; margin-bottom: 24px; padding: 22px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); }
h1 { font-size: 1.8rem; color: var(--accent); margin-bottom: 6px; }
.subtitle { color: var(--text-muted); font-size: 0.95rem; }
.filter-bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.filter-btn { background: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: 0.2s; }
.filter-btn.active, .filter-btn:hover { background: var(--accent); color: #000; font-weight: 700; border-color: var(--accent); }
.card { background: var(--card-bg); padding: 28px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
.progress-bar { height: 8px; background: var(--bg-dark); border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
.progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }
.meta-info { display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 14px; font-weight: 600; }
.category-badge { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 3px 10px; border-radius: 99px; font-size: 0.8rem; border: 1px solid rgba(56, 189, 248, 0.3); }
.question-text { font-size: 1.25rem; font-weight: 600; margin-bottom: 18px; }
.symbol-display { background: #0b1120; border: 1px solid var(--border); border-radius: 10px; padding: 24px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; min-height: 140px; }
.symbol-display svg { max-width: 240px; height: 90px; }
.symbol-display svg.big { width: 100%; max-width: 440px; height: auto; max-height: 520px; }
.options-list { display: flex; flex-direction: column; gap: 12px; }
.option-btn { background: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border); padding: 14px 18px; border-radius: 8px; text-align: left; font-size: 0.98rem; cursor: pointer; transition: all 0.2s; }
.option-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(56, 189, 248, 0.05); }
.option-btn.correct { background: rgba(34, 197, 94, 0.2) !important; border-color: var(--correct) !important; color: #fff !important; font-weight: 600; }
.option-btn.wrong { background: rgba(239, 68, 68, 0.2) !important; border-color: var(--wrong) !important; color: #fff !important; }
.option-btn:disabled { cursor: default; }
.typein-box { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
.cmd-input { width: 100%; background: var(--code-bg); border: 1px solid var(--border); color: #38bdf8; font-family: monospace; font-size: 1.1rem; padding: 14px; border-radius: 8px; outline: none; }
.cmd-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
.submit-cmd-btn { background: var(--accent); color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem; align-self: flex-start; }
.submit-cmd-btn:hover { background: var(--accent-hover); color: #fff; }
.submit-cmd-btn:disabled { opacity: 0.5; cursor: default; }
.feedback-box { margin-top: 22px; padding: 16px; border-radius: 8px; background: rgba(15, 23, 42, 0.85); border-left: 4px solid var(--accent); display: none; }
.feedback-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 6px; }
.feedback-text { font-size: 0.95rem; color: #cbd5e1; }
.feedback-text .line { margin-bottom: 8px; }
.controls { margin-top: 24px; display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
.hint { color: var(--text-muted); font-size: 0.8rem; }
.next-btn { background: var(--accent); color: #000; border: none; padding: 12px 26px; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; display: none; }
.next-btn:hover { background: var(--accent-hover); color: #fff; }
.result-screen { text-align: center; display: none; }
.score-circle { font-size: 3.2rem; font-weight: 800; color: var(--accent); margin: 20px 0; }
.result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.missed { text-align: left; margin: 20px 0; padding: 14px 18px; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; color: #cbd5e1; }
.missed h3 { margin-bottom: 8px; color: var(--wrong); font-size: 1rem; }
.missed li { margin-left: 18px; margin-bottom: 4px; }
code { background: #000; padding: 2px 6px; border-radius: 4px; color: #38bdf8; font-family: monospace; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Git & Flowchart - Provträning</h1>
    <p class="subtitle">Enkel träning inför provet: Git-kommandon, push/pull och flödesscheman.</p>
    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-filter="Alla">Alla</button>
      <button class="filter-btn" data-filter="Kommandon">Skriv kommandot</button>
      <button class="filter-btn" data-filter="Push/Pull">Push &amp; Pull</button>
      <button class="filter-btn" data-filter="Git-koncept">Git-koncept</button>
      <button class="filter-btn" data-filter="Flödesschema">Flödesschema</button>
    </div>
  </header>

  <div class="card" id="quiz-card">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="meta-info">
      <span id="question-counter">Fråga 1</span>
      <span class="category-badge" id="category-badge">Kategori</span>
    </div>
    <div class="question-text" id="question-text">Laddar fråga...</div>
    <div class="symbol-display" id="symbol-display" style="display: none;"></div>
    <div class="options-list" id="options-list"></div>
    <div class="typein-box" id="typein-box" style="display: none;">
      <input type="text" class="cmd-input" id="cmd-input" placeholder="Skriv kommandot här, t.ex. git ..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="submit-cmd-btn" id="submit-cmd-btn" onclick="checkTypedAnswer()">Bekräfta svar</button>
    </div>
    <div class="feedback-box" id="feedback-box">
      <div class="feedback-title" id="feedback-title"></div>
      <div class="feedback-text" id="feedback-text"></div>
    </div>
    <div class="controls">
      <span class="hint" id="enter-hint" style="display:none;">Tryck Enter för nästa</span>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">Nästa →</button>
    </div>
  </div>

  <div class="card result-screen" id="result-screen">
    <h2>Resultat</h2>
    <div class="score-circle" id="final-score">0 / 0</div>
    <p id="result-message" style="margin-bottom: 8px; color: var(--text-muted);"></p>
    <div class="missed" id="missed-box" style="display:none;"></div>
    <div class="result-actions">
      <button class="next-btn" id="retry-wrong-btn" style="display:none;" onclick="retryWrong()">Träna på mina fel</button>
      <button class="next-btn" style="display:inline-block;" onclick="startQuiz(currentFilter)">Försök igen</button>
    </div>
  </div>
</div>

<script>
// ---------- Symboler ----------
const svgSymbols = {
  terminator: `<svg viewBox="0 0 200 80"><rect x="10" y="15" width="180" height="50" rx="25" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="4"/><text x="100" y="47" fill="#f8fafc" font-size="16" text-anchor="middle" font-weight="bold">START / SLUT</text></svg>`,
  process: `<svg viewBox="0 0 200 80"><rect x="15" y="15" width="170" height="50" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="4"/><text x="100" y="47" fill="#f8fafc" font-size="15" text-anchor="middle" font-weight="bold">SUM = A + B</text></svg>`,
  decision: `<svg viewBox="0 0 200 90"><polygon points="100,5 185,45 100,85 15,45" fill="#eab308" fill-opacity="0.2" stroke="#eab308" stroke-width="4"/><text x="100" y="50" fill="#f8fafc" font-size="14" text-anchor="middle" font-weight="bold">Ålder ≥ 18 ?</text></svg>`,
  io: `<svg viewBox="0 0 200 80"><polygon points="35,15 190,15 165,65 10,65" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="4"/><text x="100" y="47" fill="#f8fafc" font-size="14" text-anchor="middle" font-weight="bold">Ange lösenord</text></svg>`,
  arrow: `<svg viewBox="0 0 200 80"><line x1="20" y1="40" x2="160" y2="40" stroke="#38bdf8" stroke-width="5"/><polygon points="155,22 190,40 155,58" fill="#38bdf8"/></svg>`
};

// ---------- Flödesscheman som bilder ----------
const COL = { term: '#38bdf8', proc: '#38bdf8', dec: '#eab308', io: '#a855f7', line: '#94a3b8' };
const fsTxt = (x, y, s, sz) => {
  sz = sz || 12;
  const lines = s.split('|');
  const start = y + 4 - (lines.length - 1) * sz * 0.6;
  return `<text fill="#f8fafc" font-size="${sz}" text-anchor="middle" font-weight="bold">` +
    lines.map((l, i) => `<tspan x="${x}" y="${start + i * sz * 1.2}">${l}</tspan>`).join('') + '</text>';
};
const fsTerm = (cx, cy, s, w) => { w = w || 100; return `<rect x="${cx - w / 2}" y="${cy - 15}" width="${w}" height="30" rx="15" fill="${COL.term}" fill-opacity="0.2" stroke="${COL.term}" stroke-width="2.5"/>` + fsTxt(cx, cy, s); };
const fsProc = (cx, cy, s, w) => { w = w || 150; return `<rect x="${cx - w / 2}" y="${cy - 17}" width="${w}" height="34" fill="${COL.proc}" fill-opacity="0.2" stroke="${COL.proc}" stroke-width="2.5"/>` + fsTxt(cx, cy, s, 11); };
const fsDec = (cx, cy, s, w) => { w = w || 150; return `<polygon points="${cx},${cy - 25} ${cx + w / 2},${cy} ${cx},${cy + 25} ${cx - w / 2},${cy}" fill="${COL.dec}" fill-opacity="0.2" stroke="${COL.dec}" stroke-width="2.5"/>` + fsTxt(cx, cy, s, 11); };
const fsIO = (cx, cy, s, w) => { w = w || 150; const k = 10; return `<polygon points="${cx - w / 2 + k},${cy - 15} ${cx + w / 2},${cy - 15} ${cx + w / 2 - k},${cy + 15} ${cx - w / 2},${cy + 15}" fill="${COL.io}" fill-opacity="0.2" stroke="${COL.io}" stroke-width="2.5"/>` + fsTxt(cx, cy, s, 11); };
const fsLn = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${COL.line}" stroke-width="2" marker-end="url(#ah)"/>`;
const fsPlain = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${COL.line}" stroke-width="2"/>`;
const fsPoly = pts => `<polyline points="${pts}" fill="none" stroke="${COL.line}" stroke-width="2" marker-end="url(#ah)"/>`;
const fsLbl = (x, y, s) => `<text x="${x}" y="${y}" fill="#cbd5e1" font-size="11" text-anchor="middle">${s}</text>`;
const fsSvg = (w, h, parts) => `<svg class="big" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${COL.line}"/></marker></defs>${parts.join('')}</svg>`;

function flowBetyg(validate) {
  const cx = 110, p = [];
  let y = 20, prevKind = 'term';
  const next = kind => {
    const pb = prevKind === 'dec' ? 25 : 15, ct = kind === 'dec' ? 25 : 15;
    const ny = y + pb + 20 + ct;
    p.push(fsLn(cx, y + pb, cx, ny - ct));
    if (prevKind === 'dec') p.push(fsLbl(cx + 16, y + pb + 13, 'Nej'));
    y = ny; prevKind = kind;
  };
  p.push(fsTerm(cx, y, 'Start'));
  next('io'); const inputY = y;
  p.push(fsIO(cx, y, 'Mata in poäng', 140));
  if (validate) {
    next('dec');
    p.push(fsDec(cx, y, 'Poäng &lt; 0|eller &gt; 100?', 170));
    p.push(fsLn(cx + 85, y, 228, y)); p.push(fsLbl(cx + 100, y - 7, 'Ja'));
    p.push(fsIO(285, y, 'Ogiltig inmatning', 120));
    p.push(fsPoly(`285,${y - 15} 285,${inputY} ${cx + 72},${inputY}`));
  }
  const ys = [];
  [['A', 90], ['B', 80], ['C', 70], ['D', 60], ['E', 50]].forEach(([g, lim]) => {
    next('dec');
    p.push(fsDec(cx, y, 'Poäng ≥ ' + lim + '?', 130));
    p.push(fsLn(cx + 65, y, 243, y)); p.push(fsLbl(cx + 80, y - 7, 'Ja'));
    p.push(fsIO(290, y, 'Betyg ' + g, 90));
    p.push(fsPlain(333, y, 360, y));
    ys.push(y);
  });
  next('io'); p.push(fsIO(cx, y, 'Betyg F', 120));
  next('term'); p.push(fsTerm(cx, y, 'Slut'));
  p.push(fsPoly(`360,${ys[0]} 360,${y} ${cx + 50},${y}`));
  return fsSvg(380, y + 30, p);
}

function flowTemp() {
  const cx = 110, p = [];
  p.push(fsTerm(cx, 20, 'Start')); p.push(fsLn(cx, 35, cx, 60));
  p.push(fsIO(cx, 75, 'Ange temperatur', 150)); p.push(fsLn(cx, 90, cx, 115));
  p.push(fsDec(cx, 140, 'Temperatur|&gt; 0?', 140));
  p.push(fsLn(cx + 70, 140, 240, 140)); p.push(fsLbl(cx + 90, 133, 'Ja'));
  p.push(fsIO(300, 140, 'Över fryspunkt', 130));
  p.push(fsLn(cx, 165, cx, 200)); p.push(fsLbl(cx + 16, 183, 'Nej'));
  p.push(fsIO(cx, 215, 'Fryspunkt', 130));
  p.push(fsLn(cx, 230, cx, 255));
  p.push(fsTerm(cx, 270, 'Slut'));
  p.push(fsPoly(`300,155 300,270 ${cx + 50},270`));
  return fsSvg(380, 300, p);
}

function flowLosen() {
  const cx = 225, p = [];
  p.push(fsTerm(cx, 20, 'Start')); p.push(fsLn(cx, 35, cx, 55));
  p.push(fsIO(cx, 70, 'Ange lösenord', 130)); p.push(fsLn(cx, 85, cx, 110));
  p.push(fsDec(cx, 135, 'Är det|rätt?', 110));
  p.push(fsLn(170, 135, 132, 135)); p.push(fsLbl(152, 128, 'Ja'));
  p.push(fsProc(80, 135, 'Inloggning', 100));
  p.push(fsLn(80, 152, 80, 185));
  p.push(fsIO(80, 200, 'Du är inne på ditt konto', 150));
  p.push(fsPoly(`80,215 80,400 ${cx - 50},400`));
  p.push(fsLn(280, 135, 317, 135)); p.push(fsLbl(298, 128, 'Nej'));
  p.push(fsIO(385, 135, 'Visa felmeddelande', 140));
  p.push(fsLn(385, 150, 385, 190));
  p.push(fsDec(385, 215, 'Finns det försök|kvar?', 150));
  p.push(fsPoly(`460,215 478,215 478,70 292,70`)); p.push(fsLbl(470, 207, 'Ja'));
  p.push(fsLn(385, 240, 385, 268)); p.push(fsLbl(401, 258, 'Nej'));
  p.push(fsProc(385, 285, 'Kontolåsning', 130));
  p.push(fsLn(385, 302, 385, 325));
  p.push(fsIO(385, 340, 'Kontot är låst', 130));
  p.push(fsPoly(`385,355 385,400 ${cx + 50},400`));
  p.push(fsTerm(cx, 400, 'Slut'));
  return fsSvg(490, 430, p);
}

svgSymbols.flowBetyg = flowBetyg(false);
svgSymbols.flowBetygValid = flowBetyg(true);
svgSymbols.flowTemp = flowTemp();
svgSymbols.flowLosen = flowLosen();

// ---------- Frågor ----------
const allQuestions = [

// ===== KOMMANDON (skriv själv) =====
{ type: "typein", category: "Kommandon",
  question: "Skriv kommandot för att skapa ett nytt Git-repositorium i en mapp.",
  validAnswers: ["git init"],
  explanation: "'git init' gör mappen till ett Git-repo." },
{ type: "typein", category: "Kommandon",
  question: "Skriv kommandot som visar status för ändringar i projektet.",
  validAnswers: ["git status"],
  explanation: "'git status' visar vilka filer som är ändrade eller stageade." },
{ type: "typein", category: "Kommandon",
  question: "Skriv kommandot som lägger till ALLA ändringar i staging (stage).",
  validAnswers: ["git add ."],
  explanation: "'git add .' lägger till alla filer och ändringar i den aktuella mappen. Glöm inte punkten." },
{ type: "typein", category: "Kommandon",
  question: "Skriv kommandot som lägger till filen uddaTal.py i staging.",
  validAnswers: ["git add uddaTal.py"],
  explanation: "'git add <filnamn>' lägger till en enda fil." },
{ type: "typein", category: "Kommandon",
  question: "Skriv kommandot för att göra en commit med meddelandet \"Fixat bugg\".",
  validAnswers: ['git commit -m "Fixat bugg"', "git commit -m 'Fixat bugg'"],
  explanation: "'git commit -m \"meddelande\"' sparar en version med ett meddelande." },
{ type: "typein", category: "Kommandon",
  question: "Skriv kommandot som visar historiken över commits.",
  validAnswers: ["git log"],
  explanation: "'git log' visar alla commits med commit-ID." },
{ type: "typein", category: "Kommandon",
  question: "Skriv kommandot som visar vilka branches som finns och vilken du står i.",
  validAnswers: ["git branch"],
  explanation: "'git branch' listar alla grenar. Den aktiva har en stjärna (*)." },
{ type: "typein", category: "Kommandon",
  question: "Skriv kommandot för att skapa en ny branch som heter area-funktion.",
  validAnswers: ["git branch area-funktion"],
  explanation: "'git branch <namn>' skapar en ny gren." },
{ type: "typein", category: "Kommandon",
  question: "Skriv kommandot för att byta till en branch som redan finns, area-funktion.",
  validAnswers: ["git checkout area-funktion", "git switch area-funktion"],
  explanation: "'git checkout <branch>' byter gren. 'git switch <branch>' fungerar också." },
{ type: "typein", category: "Kommandon",
  question: "Skriv kommandot för att både skapa och byta till en ny branch som heter login.",
  validAnswers: ["git checkout -b login", "git switch -c login"],
  explanation: "'git checkout -b <namn>' skapar och byter. Den moderna varianten är 'git switch -c <namn>'." },
{ type: "typein", category: "Kommandon",
  question: "Skriv kommandot för att radera branchen old-feature.",
  validAnswers: ["git branch -d old-feature"],
  explanation: "'git branch -d <namn>' raderar en gren." },
{ type: "typein", category: "Kommandon",
  question: "Skriv kommandot som visar vilken version av Git du har installerad.",
  validAnswers: ["git --version"],
  explanation: "'git --version' visar versionen och bekräftar att Git är installerat." },
{ type: "typein", category: "Kommandon",
  question: "Skriv kommandot för att ställa in ditt namn i Git till \"Anna\" (global inställning).",
  validAnswers: ['git config --global user.name "Anna"', "git config --global user.name 'Anna'"],
  explanation: "git config --global user.name \"namn\" sparar ditt namn i dina commits." },
{ type: "typein", category: "Kommandon",
  question: "Skriv kommandot för att ställa in din e-post i Git till anna@example.com (global inställning).",
  validAnswers: ['git config --global user.email "anna@example.com"', "git config --global user.email 'anna@example.com'"],
  explanation: "Använd samma e-post som på GitHub." },

// ===== PUSH & PULL =====
{ type: "typein", category: "Push/Pull",
  question: "Skriv kommandot som laddar upp dina lokala commits till fjärr-repot (GitHub).",
  validAnswers: ["git push", "git push origin main", "git push origin master"],
  explanation: "'git push' skickar dina commits upp till GitHub." },
{ type: "typein", category: "Push/Pull",
  question: "Skriv kommandot som hämtar ändringar från fjärr-repot och slår ihop dem med ditt lokala repo.",
  validAnswers: ["git pull", "git pull origin main", "git pull origin master"],
  explanation: "'git pull' hämtar ner ändringar från GitHub." },
{ type: "mcq", category: "Push/Pull",
  question: "Vad gör git push?",
  options: [
    "Laddar upp lokala ändringar till fjärr-repot",
    "Hämtar ändringar från fjärr-repot",
    "Skapar en ny branch",
    "Visar historiken över commits"
  ],
  correct: 0,
  explanation: "Push = ladda upp. Pull = hämta ner." },
{ type: "mcq", category: "Push/Pull",
  question: "Vad gör git pull?",
  options: [
    "Hämtar ändringar från fjärr-repot och slår ihop dem med ditt lokala repo",
    "Laddar upp dina commits till GitHub",
    "Raderar en branch",
    "Skapar ett nytt repo"
  ],
  correct: 0,
  explanation: "Pull = hämta ner ändringar från fjärr-repot." },
{ type: "mcq", category: "Push/Pull",
  question: "Du har gjort en commit, men din kompis ser inte koden på GitHub. Vad saknas?",
  options: [
    "git push",
    "git init",
    "git status",
    "git log"
  ],
  correct: 0,
  explanation: "En commit sparas bara lokalt. Med 'git push' laddas den upp till GitHub." },
{ type: "mcq", category: "Push/Pull",
  question: "Var ligger ett remote repository (fjärr-repo)?",
  options: [
    "På en server eller molntjänst, t.ex. GitHub",
    "Bara på din egen dator",
    "I staging area",
    "I en .py-fil"
  ],
  correct: 0,
  explanation: "Fjärr-repo ligger på en annan dator eller server, oftast GitHub eller GitLab. Local repo ligger på din egen dator." },

// ===== GIT-KONCEPT =====
{ type: "mcq", category: "Git-koncept",
  question: "Vad är Git?",
  options: [
    "Ett program som sparar och spårar ändringar i kod",

// ---------- Tillstånd ----------
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let currentFilter = 'Alla';
let wrongList = [];
let answered = false;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function updateFilterCounts() {
  document.querySelectorAll('.filter-btn').forEach(btn => {
    const f = btn.dataset.filter;
    const n = f === 'Alla' ? allQuestions.length : allQuestions.filter(q => q.category === f).length;
    btn.textContent = btn.textContent.replace(/\s*\(\d+\)$/, '') + ' (' + n + ')';
  });
}

function startQuiz(filter, custom) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === filter);
  });
  if (custom) currentQuestions = custom.slice();
  else currentQuestions = filter === 'Alla' ? allQuestions.slice() : allQuestions.filter(q => q.category === filter);
  shuffle(currentQuestions);
  currentIndex = 0;
  score = 0;
  wrongList = [];
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-card').style.display = 'block';
  showQuestion();
}

function retryWrong() {
  startQuiz(currentFilter, wrongList.slice());
}

function showQuestion() {
  const q = currentQuestions[currentIndex];
  const total = currentQuestions.length;
  answered = false;

  document.getElementById('question-counter').textContent = 'Fråga ' + (currentIndex + 1) + ' av ' + total;
  document.getElementById('category-badge').textContent = q.category;
  document.getElementById('progress-fill').style.width = ((currentIndex / total) * 100) + '%';
  document.getElementById('question-text').textContent = q.question;

  const symbolDisplay = document.getElementById('symbol-display');
  const optionsList = document.getElementById('options-list');
  const typeinBox = document.getElementById('typein-box');
  const cmdInput = document.getElementById('cmd-input');

  symbolDisplay.style.display = 'none';
  symbolDisplay.innerHTML = '';
  optionsList.style.display = 'none';
  optionsList.innerHTML = '';
  typeinBox.style.display = 'none';
  cmdInput.value = '';
  cmdInput.disabled = false;
  cmdInput.style.borderColor = '';
  document.getElementById('submit-cmd-btn').disabled = false;
  document.getElementById('feedback-box').style.display = 'none';
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('enter-hint').style.display = 'none';

  if (q.symbol && svgSymbols[q.symbol]) {
    symbolDisplay.innerHTML = svgSymbols[q.symbol]; // egna, statiska SVG-strängar
    symbolDisplay.style.display = 'flex';
  }

  if (q.type === 'typein') {
    typeinBox.style.display = 'flex';
    cmdInput.focus();
  } else {
    optionsList.style.display = 'flex';
    const indices = shuffle(q.options.map((_, i) => i));
    indices.forEach(optIndex => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = q.options[optIndex];
      btn.dataset.correct = (optIndex === q.correct);
      btn.onclick = () => selectOption(btn, optIndex === q.correct, q);
      optionsList.appendChild(btn);
    });
  }
}

function showNext() {
  answered = true;
  document.getElementById('feedback-box').style.display = 'block';
  document.getElementById('next-btn').style.display = 'inline-block';
  document.getElementById('enter-hint').style.display = 'inline';
}

function selectOption(selectedBtn, isCorrect, q) {
  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.correct === 'true') btn.classList.add('correct');
  });
  const title = document.getElementById('feedback-title');
  const text = document.getElementById('feedback-text');
  text.textContent = q.explanation;
  if (isCorrect) {
    score++;
    title.textContent = 'Rätt! 🎯';
    title.style.color = 'var(--correct)';
  } else {
    selectedBtn.classList.add('wrong');
    wrongList.push(q);
    title.textContent = 'Inte riktigt ❌';
    title.style.color = 'var(--wrong)';
  }
  showNext();
}

// Normalisera: små bokstäver, enkla/dubbla citattecken lika, extra mellanslag bort
function normalize(str) {
  return str.toLowerCase().replace(/['“”‘’]/g, '"').replace(/[–—]/g, '-').replace(/\s+/g, ' ').trim();
}

function addLine(parent, label, codeText) {
  const div = document.createElement('div');
  div.className = 'line';
  div.appendChild(document.createTextNode(label + ' '));
  const c = document.createElement('code');
  c.textContent = codeText;
  div.appendChild(c);
  parent.appendChild(div);
}

function checkTypedAnswer() {
  if (answered) return;
  const q = currentQuestions[currentIndex];
  const input = document.getElementById('cmd-input');
  const userVal = input.value.trim();
  if (!userVal) return;

  input.disabled = true;
  document.getElementById('submit-cmd-btn').disabled = true;

  const isCorrect = q.validAnswers.some(ans => normalize(ans) === normalize(userVal));
  const title = document.getElementById('feedback-title');
  const text = document.getElementById('feedback-text');
  text.innerHTML = '';

  if (isCorrect) {
    score++;
    input.style.borderColor = 'var(--correct)';
    title.textContent = 'Rätt kommando! 💻';
    title.style.color = 'var(--correct)';
    addLine(text, 'Rätt:', userVal);
  } else {
    wrongList.push(q);
    input.style.borderColor = 'var(--wrong)';
    title.textContent = 'Inte riktigt rätt ❌';
    title.style.color = 'var(--wrong)';
    addLine(text, 'Du skrev:', userVal);
    addLine(text, 'Rätt är t.ex.:', q.validAnswers[0]);
  }
  const expl = document.createElement('div');
  expl.textContent = q.explanation;
  text.appendChild(expl);
  showNext();
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < currentQuestions.length) showQuestion();
  else showResults();
}

function showResults() {
  document.getElementById('quiz-card').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';
  document.getElementById('progress-fill').style.width = '100%';

  const total = currentQuestions.length;
  document.getElementById('final-score').textContent = score + ' / ' + total;
  const pct = Math.round((score / total) * 100);
  let msg = 'Du fick ' + pct + '% rätt. ';
  if (pct === 100) msg += 'Fullpoäng! Du kan kommandona och flödesschemana.';
  else if (pct >= 80) msg += 'Starkt resultat! Titta på de du missade nedan.';
  else if (pct >= 60) msg += 'Helt okej, kör gärna en runda till på det du missade.';
  else msg += 'Bra träning! Kör "Träna på mina fel" så sätter det sig.';
  document.getElementById('result-message').textContent = msg;

  const missedBox = document.getElementById('missed-box');
  const retryBtn = document.getElementById('retry-wrong-btn');
  missedBox.innerHTML = '';
  if (wrongList.length) {
    const h = document.createElement('h3');
    h.textContent = 'Du missade (' + wrongList.length + '):';
    missedBox.appendChild(h);
    const ul = document.createElement('ul');
    wrongList.forEach(q => {
      const li = document.createElement('li');
      li.textContent = q.question;
      ul.appendChild(li);
    });
    missedBox.appendChild(ul);
    missedBox.style.display = 'block';
    retryBtn.style.display = 'inline-block';
  } else {
    missedBox.style.display = 'none';
    retryBtn.style.display = 'none';
  }
}

// ---------- Händelser ----------
document.getElementById('filter-bar').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (btn) startQuiz(btn.dataset.filter);
});

document.getElementById('cmd-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkTypedAnswer();
});

// Enter går vidare till nästa fråga när ett svar har getts
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !answered) return;
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'BUTTON') return;
  if (document.getElementById('quiz-card').style.display === 'none') return;
  nextQuestion();
});

updateFilterCounts();
startQuiz('Alla');
</script>
