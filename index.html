<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Kommandon, Push/Pull & Utökade Flödesscheman</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --correct: #22c55e;
            --wrong: #ef4444;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { max-width: 800px; width: 100%; margin: auto; }
        header { text-align: center; margin-bottom: 24px; padding: 20px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); }
        h1 { font-size: 1.8rem; color: var(--accent); margin-bottom: 8px; }
        .subtitle { color: var(--text-muted); font-size: 0.95rem; }
        .filter-bar { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 15px; }
        .filter-btn { background: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .filter-btn.active, .filter-btn:hover { background: var(--accent); color: #000; font-weight: 600; border-color: var(--accent); }
        .card { background: var(--card-bg); padding: 28px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .progress-bar { height: 8px; background: var(--bg-dark); border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }
        .meta-info { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 12px; font-weight: 600; }
        .category-badge { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 2px 10px; border-radius: 99px; font-size: 0.8rem; }
        .question-text { font-size: 1.25rem; font-weight: 600; margin-bottom: 20px; }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border); padding: 14px 18px; border-radius: 8px; text-align: left; font-size: 1rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between; }
        .option-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(56, 189, 248, 0.05); }
        .option-btn.correct { background: rgba(34, 197, 94, 0.2); border-color: var(--correct); color: #fff; }
        .option-btn.wrong { background: rgba(239, 68, 68, 0.2); border-color: var(--wrong); color: #fff; }
        .option-btn:disabled { cursor: default; }
        .feedback-box { margin-top: 20px; padding: 16px; border-radius: 8px; background: rgba(15, 23, 42, 0.7); border-left: 4px solid var(--accent); display: none; }
        .feedback-title { font-weight: 700; margin-bottom: 4px; }
        .controls { margin-top: 24px; display: flex; justify-content: flex-end; }
        .next-btn { background: var(--accent); color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; display: none; }
        .next-btn:hover { background: var(--accent-hover); color: #fff; }
        .result-screen { text-align: center; display: none; }
        .score-circle { font-size: 3rem; font-weight: 800; color: var(--accent); margin: 20px 0; }
        code { background: #000; padding: 2px 6px; border-radius: 4px; color: #38bdf8; font-family: monospace; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Git Kommandon, Push/Pull & Flödesscheman</h1>
        <p class="subtitle">Träna på alla Git-kommandon och flödesschemasymboler från lektionsmaterialet</p>
        <div class="filter-bar">
            <button class="filter-btn active" onclick="startQuiz('Alla')">Alla (30)</button>
            <button class="filter-btn" onclick="startQuiz('Git Kommandon')">Git Kommandon</button>
            <button class="filter-btn" onclick="startQuiz('Branches')">Branches</button>
            <button class="filter-btn" onclick="startQuiz('Push & Pull')">Push & Pull</button>
            <button class="filter-btn" onclick="startQuiz('Flowchart')">Flowchart Symboler</button>
        </div>
    </header>

    <div class="card" id="quiz-card">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="meta-info">
            <span id="question-counter">Fråga 1 av 30</span>
            <span class="category-badge" id="category-badge">Kategori</span>
        </div>
        <div class="question-text" id="question-text">Laddar fråga...</div>
        <div class="options-list" id="options-list"></div>
        <div class="feedback-box" id="feedback-box">
            <div class="feedback-title" id="feedback-title"></div>
            <div id="feedback-text"></div>
        </div>
        <div class="controls">
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Nästa fråga →</button>
        </div>
    </div>

    <div class="card result-screen" id="result-screen">
        <h2>Quiz slutfört!</h2>
        <div class="score-circle" id="final-score">0 / 0</div>
        <p id="result-message" style="margin-bottom: 24px; color: var(--text-muted);"></p>
        <button class="next-btn" style="display:inline-block;" onclick="startQuiz(currentFilter)">Kör igen</button>
    </div>
</div>

let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let currentFilter = 'Alla';

function startQuiz(category) {
    currentFilter = category;
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.startsWith(category));
    });
    if (category === 'Alla') {
        currentQuestions = [...allQuestions];
    } else {
        currentQuestions = allQuestions.filter(q => q.category === category);
    }
    currentIndex = 0;
    score = 0;
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('quiz-card').style.display = 'block';
    showQuestion();
}

function showQuestion() {
    const q = currentQuestions[currentIndex];
    const total = currentQuestions.length;
    document.getElementById('question-counter').textContent = `Fråga ${currentIndex + 1} av ${total}`;
    document.getElementById('category-badge').textContent = q.category;
    document.getElementById('progress-fill').style.width = `${((currentIndex) / total) * 100}%`;
    document.getElementById('question-text').textContent = q.question;

    const optionsList = document.getElementById('options-list');
    optionsList.innerHTML = '';

    let indices = q.options.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
    }

    indices.forEach(optIndex => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = q.options[optIndex];
        btn.onclick = () => selectOption(btn, optIndex === q.correct, q.explanation);
        btn.dataset.correct = (optIndex === q.correct);
        optionsList.appendChild(btn);
    });

    document.getElementById('feedback-box').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
}

function selectOption(selectedBtn, isCorrect, explanation) {
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.dataset.correct === "true") {
            btn.classList.add('correct');
        }
    });

    const feedbackBox = document.getElementById('feedback-box');
    const feedbackTitle = document.getElementById('feedback-title');
    const feedbackText = document.getElementById('feedback-text');

    if (isCorrect) {
        score++;
        selectedBtn.classList.add('correct');
        feedbackTitle.textContent = "Rätt svar! 🎉";
        feedbackTitle.style.color = "var(--correct)";
    } else {
        selectedBtn.classList.add('wrong');
        feedbackTitle.textContent = "Fel svar";
        feedbackTitle.style.color = "var(--wrong)";
    }

    feedbackText.textContent = explanation;
    feedbackBox.style.display = 'block';
    document.getElementById('next-btn').style.display = 'inline-block';
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
        showQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById('quiz-card').style.display = 'none';
    const resultScreen = document.getElementById('result-screen');
    resultScreen.style.display = 'block';
    const total = currentQuestions.length;
    document.getElementById('final-score').textContent = `${score} / ${total}`;
    const pct = Math.round((score / total) * 100);
    let msg = `Du fick ${pct}% rätt! `;
    if (pct === 100) msg += "Full pott! Du har järnkoll på Git-kommandon och alla flödesschemasymboler.";
    else if (pct >= 80) msg += "Grymt bra jobbat! Du behärskar både kommandona och symbolerna.";
    else msg += "Bra kämpat! Repetera gärna symbolerna och kommandona en extra gång.";
    document.getElementById('result-message').textContent = msg;
}

startQuiz('Alla');
</script>
